<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Multi-Tenant Platform — Systems</title>
    <style>
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; padding: 1.5rem; font-family: sans-serif; margin: 0; }
        .wrap { max-width: 64rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 1rem; }
        .title { font-size: 1.5rem; font-weight: 700; color: #818cf8; margin: 0; }
        .subtitle { font-size: 0.875rem; color: #94a3b8; margin: 0.25rem 0 0; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
        .card-title { font-size: 1.125rem; font-weight: 700; color: #818cf8; margin: 0; }
        input[type="text"], input[type="password"], select {
            background-color: #0f172a; color: #f8fafc; border: 1px solid #475569;
            border-radius: 0.5rem; padding: 0.625rem 0.75rem; font-size: 0.875rem; width: 100%; box-sizing: border-box;
        }
        .btn { font-weight: 700; padding: 0.625rem 1.25rem; border-radius: 0.5rem; cursor: pointer; border: none; font-size: 0.875rem; }
        .btn-indigo { background-color: #4f46e5; color: #fff; }
        .btn-rose { background-color: #e11d48; color: #fff; }
        .form-row { display: flex; flex-wrap: wrap; gap: 0.75rem; }
        .flex-1 { flex: 1 1 180px; }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
        .hidden { display: none !important; }
        .system-box { background: #0f172a; border: 1px solid #334155; padding: 1rem; border-radius: 0.5rem; display: flex; flex-direction: column; gap: 0.5rem; cursor: pointer; }
        .system-box:hover { border-color: #818cf8; }
        .token-badge { background: #020617; color: #fcd34d; font-family: monospace; font-size: 0.75rem; padding: 0.5rem; border-radius: 0.375rem; border: 1px solid #334155; word-break: break-all; }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <div>
                <h1 class="title">⚡ IoT Multi-Tenant Platform</h1>
                <p class="subtitle">Select a System to Open Its Devices & Timers</p>
            </div>
            <button id="logout-btn" onclick="logout()" class="btn btn-rose hidden">Log Out</button>
        </header>

        <div id="auth-card" class="card" style="max-width: 28rem; margin: 2rem auto; width: 100%;">
            <div style="display: flex; border-bottom: 1px solid #334155; margin-bottom: 0.5rem;">
                <button id="tab-login" onclick="switchAuthTab('login')" style="flex:1; padding:0.5rem; background:none; border:none; border-bottom:2px solid #6366f1; color:#818cf8; font-weight:700; cursor:pointer;">Login</button>
                <button id="tab-register" onclick="switchAuthTab('register')" style="flex:1; padding:0.5rem; background:none; border:none; color:#94a3b8; font-weight:700; cursor:pointer;">Register</button>
            </div>
            <form id="auth-form" onsubmit="handleAuth(event)" style="display:flex; flex-direction:column; gap:1rem;">
                <input type="text" id="auth-username" placeholder="Username" required>
                <input type="password" id="auth-password" placeholder="Password" required>
                <button type="submit" id="auth-btn" class="btn btn-indigo">Login</button>
                <p id="auth-error" style="color:#fb7185; font-size:0.75rem; margin:0;" class="hidden"></p>
            </form>
        </div>

        <div id="dashboard" class="hidden" style="display:flex; flex-direction:column; gap:1.5rem;">
            <div class="card">
                <h2 class="card-title">🏗️ Create IoT System / Project</h2>
                <form onsubmit="createSystem(event)" class="form-row">
                    <input type="text" id="system-name" placeholder="System Name (e.g. Smart Greenhouse)" required class="flex-1">
                    <select id="hardware-type" style="width:auto;">
                        <option value="ESP32">ESP32</option>
                        <option value="ESP8266">ESP8266</option>
                        <option value="Arduino">Arduino</option>
                    </select>
                    <button type="submit" class="btn btn-indigo">Create System</button>
                </form>
            </div>

            <div class="card">
                <h2 class="card-title">Your Systems</h2>
                <div id="systems-list" class="grid-2"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:3000/api' : '/api';
        let token = localStorage.getItem('iot_token');
        let currentMode = 'login';

        function switchAuthTab(mode) {
            currentMode = mode;
            document.getElementById('auth-error').classList.add('hidden');
            document.getElementById('tab-login').style.borderBottom = mode === 'login' ? '2px solid #6366f1' : 'none';
            document.getElementById('tab-login').style.color = mode === 'login' ? '#818cf8' : '#94a3b8';
            document.getElementById('tab-register').style.borderBottom = mode === 'register' ? '2px solid #6366f1' : 'none';
            document.getElementById('tab-register').style.color = mode === 'register' ? '#818cf8' : '#94a3b8';
            document.getElementById('auth-btn').innerText = mode === 'login' ? 'Login' : 'Register Account';
        }

        async function handleAuth(e) {
            e.preventDefault();
            const username = document.getElementById('auth-username').value;
            const password = document.getElementById('auth-password').value;
            const errEl = document.getElementById('auth-error');
            try {
                const res = await fetch(API_URL + (currentMode === 'login' ? '/login' : '/register'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Authentication failed');
                if (currentMode === 'register') {
                    alert('Registration successful! Please log in.');
                    switchAuthTab('login');
                } else {
                    token = data.token;
                    localStorage.setItem('iot_token', token);
                    initDashboard();
                }
            } catch (err) {
                errEl.innerText = err.message;
                errEl.classList.remove('hidden');
            }
        }

        function logout() {
            localStorage.removeItem('iot_token');
            location.reload();
        }

        function openSystemPage(systemId) {
            window.location.href = `system.html?system_id=${encodeURIComponent(systemId)}`;
        }

        async function loadSystems() {
            const res = await fetch(API_URL + '/systems', { headers: { Authorization: `Bearer ${token}` } });
            const systems = await res.json();
            const list = document.getElementById('systems-list');
            list.innerHTML = '';
            if (!Array.isArray(systems) || systems.length === 0) {
                list.innerHTML = `<p style="color:#94a3b8; font-size:0.875rem;">No systems yet. Create one above.</p>`;
                return;
            }
            systems.forEach(sys => {
                list.innerHTML += `
                    <div onclick="openSystemPage('${sys.id}')" class="system-box">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <h3 style="margin:0; font-size:1rem;">${sys.system_name}</h3>
                                <span style="font-size:0.75rem; color:#818cf8; font-weight:600;">${sys.hardware_type}</span>
                            </div>
                            <span style="font-size:0.75rem; color:#34d399; font-weight:700;">Open Page →</span>
                        </div>
                        <div class="token-badge">Token: ${sys.system_token}</div>
                    </div>
                `;
            });
        }

        async function createSystem(e) {
            e.preventDefault();
            const system_name = document.getElementById('system-name').value;
            const hardware_type = document.getElementById('hardware-type').value;
            const res = await fetch(API_URL + '/systems', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                body: JSON.stringify({ system_name, hardware_type })
            });
            const data = await res.json();
            if (!res.ok) return alert(data.error || 'Failed to create system');
            document.getElementById('system-name').value = '';
            await loadSystems();
        }

        async function initDashboard() {
            document.getElementById('auth-card').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');
            await loadSystems();
        }

        if (token) initDashboard();
    </script>
</body>
</html>
