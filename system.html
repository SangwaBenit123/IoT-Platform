<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT System View</title>
    <style>
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; padding: 1.5rem; font-family: sans-serif; margin: 0; }
        .wrap { max-width: 64rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 1rem; gap: 1rem; flex-wrap: wrap; }
        .title { font-size: 1.5rem; font-weight: 700; color: #818cf8; margin: 0; }
        .subtitle { font-size: 0.875rem; color: #94a3b8; margin: 0.25rem 0 0; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
        .card-title { font-size: 1.125rem; font-weight: 700; color: #f8fafc; margin: 0; }
        .card-title-emerald { color: #34d399; }
        .card-title-amber { color: #fbbf24; }
        input, select { background-color: #0f172a; color: #f8fafc; border: 1px solid #475569; border-radius: 0.5rem; padding: 0.625rem 0.75rem; font-size: 0.875rem; }
        .btn { font-weight: 700; padding: 0.625rem 1.25rem; border-radius: 0.5rem; cursor: pointer; border: none; font-size: 0.875rem; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
        .btn-ghost { background: #1e293b; color: #e2e8f0; border: 1px solid #475569; }
        .btn-emerald { background: #059669; color: #fff; }
        .btn-amber { background: #d97706; color: #fff; }
        .btn-rose { background: #e11d48; color: #fff; }
        .form-row { display: flex; flex-wrap: wrap; gap: 0.75rem; }
        .flex-1 { flex: 1 1 170px; }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
        .box { background: #0f172a; border: 1px solid #334155; padding: 1rem; border-radius: 0.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .token-badge { background: #020617; color: #fcd34d; font-family: monospace; font-size: 0.75rem; padding: 0.5rem; border-radius: 0.375rem; border: 1px solid #334155; word-break: break-all; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem; }
        th { border-bottom: 1px solid #334155; padding: 0.75rem; color: #94a3b8; }
        td { border-bottom: 1px solid #1e293b; padding: 0.75rem; color: #cbd5e1; }
        .log-console { background: #020617; border: 1px solid #334155; border-radius: 0.5rem; padding: 1rem; font-family: monospace; font-size: 0.75rem; color: #34d399; height: 8rem; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <div>
                <h1 id="sys-heading" class="title">Loading System...</h1>
                <p id="sys-meta" class="subtitle"></p>
            </div>
            <div style="display: flex; gap: 0.5rem;">
                <a href="index.html" class="btn btn-ghost">← Back to Systems</a>
                <button onclick="logout()" class="btn btn-rose">Log Out</button>
            </div>
        </header>

        <div class="card">
            <div style="font-size: 0.875rem; color: #cbd5e1;">System Token</div>
            <div id="sys-token" class="token-badge">Loading...</div>
        </div>

        <div class="card">
            <h2 class="card-title card-title-emerald">➕ Register Device or Sensor to This System</h2>
            <form onsubmit="registerDevice(event)" class="form-row">
                <input type="text" id="new-device-id" placeholder="Device ID (e.g. temp_sensor_1)" required class="flex-1">
                <input type="text" id="new-device-name" placeholder="Name (e.g. Greenhouse Sensor)" required class="flex-1">
                <button type="submit" class="btn btn-emerald">Add Device</button>
            </form>
        </div>

        <div class="card">
            <h2 class="card-title">📱 Hardware Telemetry & Actuators</h2>
            <div id="devices-list" class="grid-2"></div>
        </div>

        <div class="card">
            <h2 class="card-title card-title-amber">⏰ Recurring Daily Timers</h2>
            <form onsubmit="createSchedule(event)" class="form-row">
                <select id="sched-device-id" required class="flex-1"><option value="">Choose Actuator...</option></select>
                <select id="sched-action" required class="flex-1">
                    <option value="">Choose Action...</option>
                    <option value="ON">Turn ON</option>
                    <option value="OFF">Turn OFF</option>
                </select>
                <input type="time" id="sched-time" required class="flex-1">
                <input type="number" id="sched-duration" min="0" required placeholder="Duration (sec, e.g. 5 or 0)" class="flex-1">
                <button type="submit" class="btn btn-amber">Save Daily Timer</button>
            </form>
            <div style="overflow-x: auto;">
                <table>
                    <thead><tr><th>Device ID</th><th>Action</th><th>Daily Time</th><th>Duration</th><th style="text-align: right;">Cancel</th></tr></thead>
                    <tbody id="schedules-table-body"></tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <h2 style="font-size: 0.875rem; font-weight: 700; color: #94a3b8; margin: 0;">📜 Live Activity Console</h2>
            <div id="console-log" class="log-console"><div>> System page initialized...</div></div>
        </div>
    </div>

    <script>
        const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:3000/api' : '/api';
        const WS_URL = window.location.hostname === 'localhost' ? 'ws://localhost:3000' : `wss://${window.location.host}`;
        const token = localStorage.getItem('iot_token');
        const params = new URLSearchParams(window.location.search);
        const systemId = params.get('system_id');
        let socket;
        let currentSystem = null;

        if (!token || !systemId) window.location.href = 'index.html';

        function log(msg) {
            const el = document.getElementById('console-log');
            el.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            el.scrollTop = el.scrollHeight;
        }

        function logout() {
            localStorage.removeItem('iot_token');
            window.location.href = 'index.html';
        }

        function initWebSocket() {
            socket = new WebSocket(WS_URL);
            socket.onopen = () => log('Connected to WebSocket Server');
            socket.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'STATE') {
                    log(`Telemetry [${msg.topic}]: ${msg.data}`);
                    const deviceId = msg.topic.split('/')[1];
                    const badge = document.getElementById(`state-${deviceId}`);
                    if (badge) {
                        badge.innerText = msg.data;
                        badge.style.background = '#083344';
                        badge.style.color = '#67e8f9';
                    }
                }
            };
        }

        async function loadSystemDetails() {
            const res = await fetch(API_URL + '/systems', { headers: { Authorization: `Bearer ${token}` } });
            const systems = await res.json();
            currentSystem = Array.isArray(systems) ? systems.find(s => String(s.id) === String(systemId)) : null;
            if (!currentSystem) {
                window.location.href = 'index.html';
                return;
            }
            document.title = `${currentSystem.system_name} — IoT System`;
            document.getElementById('sys-heading').innerText = `⚡ ${currentSystem.system_name}`;
            document.getElementById('sys-meta').innerText = `Hardware: ${currentSystem.hardware_type} • System ID: ${currentSystem.id}`;
            document.getElementById('sys-token').innerText = currentSystem.system_token;
        }

        async function loadDevices() {
            const res = await fetch(API_URL + '/devices', { headers: { Authorization: `Bearer ${token}` } });
            const data = await res.json();
            const devices = (Array.isArray(data) ? data : []).filter(d => String(d.system_id) === String(systemId));

            const schedSelect = document.getElementById('sched-device-id');
            schedSelect.innerHTML = '<option value="">Choose Actuator...</option>';
            devices.forEach(d => {
                if (!d.name.toLowerCase().includes('sensor')) {
                    schedSelect.innerHTML += `<option value="${d.device_id}">${d.name} (${d.device_id})</option>`;
                }
            });

            const list = document.getElementById('devices-list');
            list.innerHTML = '';
            if (devices.length === 0) {
                list.innerHTML = `<p style="color:#94a3b8; font-size:0.875rem;">No hardware registered in this system yet.</p>`;
                return;
            }
            devices.forEach(item => {
                const isSensor = item.name.toLowerCase().includes('sensor');
                const sysToken = currentSystem ? currentSystem.system_token : item.system_token;
                list.innerHTML += `
                    <div class="box">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                            <div>
                                <h3 style="margin:0; font-weight:700;">${item.name}</h3>
                                <p style="margin:0.25rem 0 0; font-size:0.75rem; font-family:monospace; color:#94a3b8;">ID: ${item.device_id}</p>
                            </div>
                            <span id="state-${item.device_id}" style="padding:0.25rem 0.5rem; font-size:0.75rem; font-weight:700; border-radius:0.25rem; background:#1e293b; color:#cbd5e1;">${isSensor ? 'Listening...' : 'Waiting...'}</span>
                        </div>
                        ${isSensor
                            ? `<div style="background:#1e293b; padding:0.5rem; border-radius:0.25rem; font-size:0.75rem; color:#38bdf8; font-family:monospace;">Status: Connected Sensor</div>`
                            : `<div style="display:flex; gap:0.5rem;"><button onclick="sendCommand('${sysToken}', '${item.device_id}', 'ON')" class="btn btn-emerald" style="flex:1;">TURN ON</button><button onclick="sendCommand('${sysToken}', '${item.device_id}', 'OFF')" class="btn btn-rose" style="flex:1;">TURN OFF</button></div>`}
                        <div style="display:flex; justify-content:flex-end;">
                            <button onclick="deleteDevice(${item.id}, '${item.name}')" style="background:none; border:none; color:#fb7185; text-decoration:underline; font-size:0.75rem; cursor:pointer;">Delete Device</button>
                        </div>
                    </div>
                `;
            });
        }

        async function registerDevice(e) {
            e.preventDefault();
            const device_id = document.getElementById('new-device-id').value;
            const name = document.getElementById('new-device-name').value;
            const res = await fetch(API_URL + '/devices', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                body: JSON.stringify({ system_id: systemId, device_id, name })
            });
            const data = await res.json();
            if (!res.ok) return alert(data.error || 'Failed to add device');
            document.getElementById('new-device-id').value = '';
            document.getElementById('new-device-name').value = '';
            await loadDevices();
        }

        async function deleteDevice(id, name) {
            if (!confirm(`Delete device "${name}"?`)) return;
            await fetch(API_URL + `/devices/${id}`, { method: 'DELETE', headers: { Authorization: `Bearer ${token}` } });
            await loadDevices();
            await loadSchedules();
        }

        async function loadSchedules() {
            const res = await fetch(API_URL + `/schedules?system_id=${encodeURIComponent(systemId)}`, {
                headers: { Authorization: `Bearer ${token}` }
            });
            const schedules = await res.json();
            const tbody = document.getElementById('schedules-table-body');
            tbody.innerHTML = '';
            if (!Array.isArray(schedules) || schedules.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="color:#64748b; font-style:italic;">No recurring timers set for this system.</td></tr>`;
                return;
            }
            schedules.forEach(s => {
                const durSec = Number(s.duration_sec) || 0;
                tbody.innerHTML += `
                    <tr>
                        <td style="font-family:monospace;">${s.device_id}</td>
                        <td style="font-weight:700; color:${s.action === 'ON' ? '#34d399' : '#fb7185'};">${s.action}</td>
                        <td>Every day at ${s.daily_time || '--:--'}</td>
                        <td style="color:#94a3b8;">${durSec > 0 ? `${durSec} sec` : 'No auto-revert'}</td>
                        <td style="text-align:right;"><button onclick="deleteSchedule(${s.id})" style="background:none; border:none; color:#fb7185; text-decoration:underline; font-size:0.75rem; cursor:pointer;">Cancel</button></td>
                    </tr>
                `;
            });
        }

        async function createSchedule(e) {
            e.preventDefault();
            const device_id = document.getElementById('sched-device-id').value;
            const action = document.getElementById('sched-action').value;
            const daily_time = document.getElementById('sched-time').value;
            const duration_sec = Number(document.getElementById('sched-duration').value);
            const res = await fetch(API_URL + '/schedules', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                body: JSON.stringify({ system_id: systemId, device_id, action, daily_time, duration_sec })
            });
            const data = await res.json();
            if (!res.ok) return alert(data.error || 'Failed to save timer');
            document.getElementById('sched-time').value = '';
            document.getElementById('sched-duration').value = '';
            await loadSchedules();
        }

        async function deleteSchedule(id) {
            await fetch(API_URL + `/schedules/${id}`, { method: 'DELETE', headers: { Authorization: `Bearer ${token}` } });
            await loadSchedules();
        }

        function sendCommand(system_token, device_id, state) {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ system_token, device_id, state }));
                log(`Sent ${state} to ${device_id}`);
            } else {
                alert('WebSocket is not connected.');
            }
        }

        (async () => {
            initWebSocket();
            await loadSystemDetails();
            await loadDevices();
            await loadSchedules();
        })();
    </script>
</body>
</html>
